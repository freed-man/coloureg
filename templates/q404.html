{% extends "base.html" %}
{% load static %}

{% block extra_title %} - Page Not Found{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-6">
            <h1 style="font-size: 7rem; font-weight: 900; color: #C8102E; margin-bottom: 0; line-height: 1;">404</h1>
            <h3 class="mb-3 mt-2">Page not found</h3>
            <p class="text-muted mb-4">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="{% url 'index' %}" class="btn btn-dark">
                <i class="fas fa-arrow-left me-2"></i>Back to homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
